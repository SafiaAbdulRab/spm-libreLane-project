# Basics

SYNTH_STRATEGY: "DELAY 1"
DESIGN_NAME: spm
VERILOG_FILES: dir::src/*.v
CLOCK_PERIOD: 20
CLOCK_PORT: clk
PNR_SDC_FILE: dir::src/impl.sdc
SIGNOFF_SDC_FILE: dir::src/signoff.sdc

# PDN

PDN_VOFFSET: 5
PDN_HOFFSET: 5
PDN_VWIDTH: 2
PDN_HWIDTH: 2
PDN_VPITCH: 30
PDN_HPITCH: 30
PDN_SKIPTRIM: true

# Pin Order

IO_PIN_ORDER_CFG: dir::pin_order.cfg

# Technology-Specific Configs

pdk::sky130*:
  FP_CORE_UTIL: 60
  CLOCK_PERIOD: 20.0

  scl::sky130_fd_sc_hs:
    CLOCK_PERIOD: 20

  scl::sky130_fd_sc_ls:
    MAX_FANOUT_CONSTRAINT: 5
    MAX_TRANSITION_CONSTRAINT: 0.75

pdk::gf180mcu*:
  CLOCK_PERIOD: 20.0
  FP_CORE_UTIL: 60
  MAX_FANOUT_CONSTRAINT: 4
  MAX_TRANSITION_CONSTRAINT: 0.75
  PL_TARGET_DENSITY: 0.5
